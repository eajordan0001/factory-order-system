<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>產線與叫號系統入口</title>
    <!-- PWA 連結 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4CAF50">
    <style>
        body { font-family: sans-serif; text-align: center; padding: 40px; background: #f4f4f9; }
        h1 { font-size: 32px; margin-bottom: 30px; }
        .btn-box { display: flex; flex-direction: column; gap: 20px; max-width: 400px; margin: 0 auto; }
        a { display: block; padding: 25px; font-size: 24px; color: white; text-decoration: none; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .producer-btn { background-color: #4CAF50; }
        .consumer-btn { background-color: #2196F3; }
    </style>
</head>
<body>
    <h1>產線備料系統</h1>
    <div class="btn-box">
        <a href="producer.html" class="producer-btn">📱 進入產線送單端</a>
        <a href="consumer.html" class="consumer-btn">🖥️ 進入後端備料端</a>
    </div>

    <script>
        // 註冊 Service Worker 支援 PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('sw.js').then(function(registration) {
                    console.log('ServiceWorker registration successful');
                }, function(err) {
                    console.log('ServiceWorker registration failed: ', err);
                });
            });
        }
    </script>
</body>
</html>
